<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Website Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Create Your Personalized Birthday Page</h1>
    <form action="/generate" method="post" enctype="multipart/form-data">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="media">Upload Media (Images/Videos):</label>
        <input type="file" id="media" name="media" multiple required><br><br>
        <button type="submit">Generate Website</button>
    </form>
</body>
</html>
